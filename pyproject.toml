[project]
name = "comprehensive"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
  "flask>=3.0.0",
  "markupsafe>=2.1.0",
  "nltk>=3.8",
  "psycopg[binary]>=3.2,<4",
  "textstat>=0.7.4",
]

[dependency-groups]
dev = ["pytest>=8.0.0"]

[tool.uv]
package = false

[tool.vercel]
entrypoint = "app:app"
